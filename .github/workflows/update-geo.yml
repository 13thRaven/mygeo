name: Update Filtered Geo Files

on:
  schedule:
    - cron: "27 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "categories.json"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source geo files
        run: |
          mkdir -p tmp_src dist
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat" -o tmp_src/geosite.dat
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/geoip.dat" -o tmp_src/geoip.dat

      - name: Filter and merge categories
        run: |
          python3 scripts/filter_dat.py categories.json tmp_src dist

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum geoip.dat > geoip.dat.sha256sum

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          DATE_STR=$(date -u +'%Y-%m-%d %H:%M UTC')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dat dist/*.sha256sum dist/*.txt --clobber
            gh release edit "$TAG" --notes "Обновлено: $DATE_STR"
          else
            gh release create "$TAG" dist/*.dat dist/*.sha256sum dist/*.txt --title "Geo Files (Latest)" --notes "Обновлено: $DATE_STR"
          fi

      - name: Publish to orphan release branch
        working-directory: dist
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add *.dat *.sha256sum *.txt
          git commit -m "Update geo files ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin release
